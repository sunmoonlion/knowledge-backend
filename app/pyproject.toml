[project]
name = "knowledge-backend"
version = "2.0.0.dev0"
description = "Admin 与 Web 共用的生产级 FastAPI 后端模板"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "joserfc>=1.7.3,<2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "redis>=6.4.0",
    "celery>=5.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.400",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingModuleSource = false
reportOptionalMemberAccess = true
reportAttributeAccessIssue = true
include = ["app", "core", "app/tasks"]
exclude = ["alembic"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/interfaces/endpoints/**" = ["B008"]
